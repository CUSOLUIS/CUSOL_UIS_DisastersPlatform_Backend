name: cusol-disasters

services:
  disasters-db:
    build:
      context: ./infra/postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-disasters}
      POSTGRES_USER: ${POSTGRES_USER:-disasters}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-disasters-local-only}
    volumes:
      - disasters-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - backend

  disaster-service:
    build:
      context: ./services/disaster-service
      target: development
      args:
        # CHG-111: en local no hay commit desplegado; la revisión
        # queda en "unknown" salvo que se exporte GIT_REVISION.
        GIT_REVISION: ${GIT_REVISION:-unknown}
    environment:
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-disasters}:${POSTGRES_PASSWORD:-disasters-local-only}@disasters-db:5432/${POSTGRES_DB:-disasters}
      DATABASE_POOL_MIN_SIZE: 1
      DATABASE_POOL_MAX_SIZE: 5
      WATCHFILES_FORCE_POLLING: "true"
      UPLOAD_DIR: /data/uploads
      REPORT_ENCRYPTION_KEY: ${REPORT_ENCRYPTION_KEY:-dev-local-only-report-key}
      # CHG-044: clave EXCLUSIVA de ofertas montada como secreto; aquí
      # solo viaja la ruta. Sin el archivo, readiness cae a propósito.
      AID_OFFER_ENCRYPTION_KEY_FILE: /run/secrets/cusol/aid_offer_key
    volumes:
      - ./services/disaster-service/app:/app/app:ro
      - report-uploads:/data/uploads
      - ${HOME}/.cusol-secrets:/run/secrets/cusol:ro
    depends_on:
      disasters-db:
        condition: service_healthy
    expose:
      - "8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  identity-service:
    build:
      context: ./services/identity-service
      target: development
    environment:
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-disasters}:${POSTGRES_PASSWORD:-disasters-local-only}@disasters-db:5432/${POSTGRES_DB:-disasters}
      DATABASE_POOL_MIN_SIZE: 1
      DATABASE_POOL_MAX_SIZE: 5
      WATCHFILES_FORCE_POLLING: "true"
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      VERIFICATION_TTL_HOURS: ${VERIFICATION_TTL_HOURS:-24}
      # CHG-043: la entrega de correo vive en el mail-service.
      MAIL_SERVICE_URL: http://mail-service:8003
      # CHG-036: cuenta inicial local. La contraseña nunca vive en Compose.
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@cusol.local}
      # CHG-036: misma clave que disaster-service para que el motivo de
      # auditoría administrativa sea legible por la consola.
      REPORT_ENCRYPTION_KEY: ${REPORT_ENCRYPTION_KEY:-dev-local-only-report-key}
    volumes:
      - ./services/identity-service/app:/app/app:ro
    depends_on:
      disasters-db:
        condition: service_healthy
      admin-bootstrap:
        condition: service_completed_successfully
      mail-service:
        condition: service_healthy
    expose:
      - "8002"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  admin-bootstrap:
    build:
      context: ./services/identity-service
      target: development
    command: ["python", "-m", "app.bootstrap_admin"]
    user: "${ADMIN_BOOTSTRAP_UID:-1001}:${ADMIN_BOOTSTRAP_GID:-1001}"
    environment:
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-disasters}:${POSTGRES_PASSWORD:-disasters-local-only}@disasters-db:5432/${POSTGRES_DB:-disasters}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@cusol.local}
      ADMIN_BOOTSTRAP_PASSWORD_FILE: /run/secrets/cusol/admin_password
      ADMIN_BOOTSTRAP_RECONCILE: ${ADMIN_BOOTSTRAP_RECONCILE:-false}
      ADMIN_BOOTSTRAP_ROTATE_PASSWORD: ${ADMIN_BOOTSTRAP_ROTATE_PASSWORD:-false}
    volumes:
      - ./services/identity-service/app:/app/app:ro
      - ${HOME}/.cusol-secrets:/run/secrets/cusol:ro
    depends_on:
      disasters-db:
        condition: service_healthy
    restart: "no"
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  mail-service:
    # CHG-043: dueño exclusivo de la entrega SMTP. Sin credenciales
    # entrega a Mailpit (desarrollo); con MAIL_SMTP_* en el `.env`
    # (jamás en el repo) usa STARTTLS + login contra Brevo. Va también
    # en `edge` porque `backend` es interna y Brevo requiere salida.
    build:
      context: ./services/mail-service
      target: development
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      SMTP_HOST: ${MAIL_SMTP_HOST:-mailpit}
      SMTP_PORT: ${MAIL_SMTP_PORT:-1025}
      SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
      SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@cusol.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Plataforma CUSOL Desastres}
      PUBLIC_BASE_URL: ${MAIL_PUBLIC_BASE_URL:-http://localhost:${FRONTEND_PORT:-3100}}
    volumes:
      - ./services/mail-service/app:/app/app:ro
    depends_on:
      mailpit:
        condition: service_started
    expose:
      - "8003"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - backend

  mailpit:
    # CHG-022: captura de correo SOLO para desarrollo local.
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - edge
      - backend
    init: true
    security_opt:
      - no-new-privileges:true

  api-gateway:
    build:
      context: ./services/api-gateway
      target: development
      args:
        # CHG-111: en local no hay commit desplegado; la revisión
        # queda en "unknown" salvo que se exporte GIT_REVISION.
        GIT_REVISION: ${GIT_REVISION:-unknown}
    environment:
      DISASTER_SERVICE_URL: http://disaster-service:8001
      IDENTITY_SERVICE_URL: http://identity-service:8002
      UPSTREAM_TIMEOUT_SECONDS: 5
      WATCHFILES_FORCE_POLLING: "true"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3100,http://127.0.0.1:3100}
    volumes:
      - ./services/api-gateway/app:/app/app:ro
    depends_on:
      disaster-service:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - backend

  frontend:
    build:
      context: ../CUSOL_UIS_DisastersPlatform_Frontend
      target: development
    environment:
      CHOKIDAR_USEPOLLING: "true"
      # Metro acepta EXPO_API_PROXY_TARGET (VITE_ se conserva por compatibilidad).
      EXPO_API_PROXY_TARGET: http://api-gateway:8000
      VITE_API_PROXY_TARGET: http://api-gateway:8000
      # CHG-006/T013: el mapa consume la API real; usar `demo` para volver al fixture.
      EXPO_PUBLIC_OPERATIONAL_MAP_DATA_MODE: ${OPERATIONAL_MAP_DATA_MODE:-api}
      # CHG-007/T016: búsqueda y reportes de personas usan la API real; `demo` solo sin backend.
      EXPO_PUBLIC_MISSING_PERSON_DATA_MODE: ${MISSING_PERSON_DATA_MODE:-api}
      # CHG-036: sesión real con bandeja demo hasta que se implementen /api/v1/admin.
      EXPO_PUBLIC_ADMIN_DATA_MODE: ${ADMIN_DATA_MODE:-demo}
      # CHG-069: "Mi espacio" contra la API real; `demo` solo sin backend.
      EXPO_PUBLIC_MY_SPACE_DATA_MODE: ${MY_SPACE_DATA_MODE:-api}
    volumes:
      - ../CUSOL_UIS_DisastersPlatform_Frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3100}:3100"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "-",
          "http://127.0.0.1:3100/",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - edge

networks:
  edge:
    name: cusol-disasters-edge
  backend:
    name: cusol-disasters-backend
    internal: true

volumes:
  disasters-data:
    name: cusol-disasters-data
  report-uploads:
    name: cusol-disasters-report-uploads
  frontend-node-modules:
    name: cusol-disasters-frontend-node-modules
