# CHG-037 — Despliegue continuo del backend al servidor de producción
# local (runner self-hosted `disasters-backend` en la Raspberry Pi).
#
# Cada push a main actualiza la carpeta viva del stack, reconstruye los
# servicios, aplica migraciones idempotentes y ejecuta el smoke completo.
# Si el árbol de producción tiene cambios trackeados sin commit, el
# despliegue ABORTA: nunca se destruye trabajo local.
name: Deploy Backend

on:
  push:
    branches: [main]

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

env:
  DEPLOY_DIR: /home/dev/DesatreNaturalColombia/CUSOL_UIS_DisastersPlatform_Backend
  # CHG-052: los runners de backend y frontend comparten el mismo
  # proyecto Compose en la Pi; el lock serializa sus despliegues para
  # que dos `up` simultáneos no dejen contenedores huérfanos.
  DEPLOY_LOCK: /home/dev/.cusol-deploy.lock

jobs:
  deploy:
    runs-on: [self-hosted, disasters-backend]
    steps:
      - name: Actualizar código en la carpeta de despliegue
        run: |
          cd "$DEPLOY_DIR"
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::El árbol de producción tiene cambios sin commit; despliegue abortado para no destruir trabajo local."
            exit 1
          fi
          git fetch origin ${{ github.sha }}
          git reset --hard ${{ github.sha }}

      - name: Validar composición
        run: cd "$DEPLOY_DIR" && flock -w 900 "$DEPLOY_LOCK" make config

      - name: Reconstruir y levantar servicios
        run: cd "$DEPLOY_DIR" && flock -w 900 "$DEPLOY_LOCK" make up

      - name: Aplicar migraciones idempotentes
        run: cd "$DEPLOY_DIR" && flock -w 900 "$DEPLOY_LOCK" make migrate

      - name: Smoke de la plataforma
        run: cd "$DEPLOY_DIR" && flock -w 900 "$DEPLOY_LOCK" make smoke

  # Despliegue al VPS de producción real (cusoldisasterplatform.com). Job
  # independiente del de arriba (que sigue apuntando a la Raspberry Pi de
  # pruebas): corre en su propio runner self-hosted y usa el
  # docker-compose.yml combinado que vive fuera de este repo, en el home del
  # VPS, junto al proxy nginx con TLS. Si la Pi está apagada o su runner no
  # responde, este job se ejecuta igual.
  deploy-vps:
    runs-on: [self-hosted, disasters-backend-prod]
    concurrency:
      group: deploy-backend-vps-production
      cancel-in-progress: false
    env:
      DEPLOY_DIR: /home/cusol01/CUSOL_UIS_DisastersPlatform_Backend
      COMPOSE_DIR: /home/cusol01
    steps:
      - name: Actualizar código en la carpeta de despliegue
        run: |
          cd "$DEPLOY_DIR"
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::El árbol de producción tiene cambios sin commit; despliegue abortado para no destruir trabajo local."
            exit 1
          fi
          git fetch origin ${{ github.sha }}
          git reset --hard ${{ github.sha }}

      - name: Reconstruir y levantar servicios de backend
        run: |
          cd "$COMPOSE_DIR"
          # CHG-111: la revisión viaja dentro de la imagen para que
          # producción pueda demostrar qué código sirve. Va por CLI y no
          # por el docker-compose.yml del VPS porque ese archivo vive
          # fuera de este repositorio.
          docker compose build --build-arg GIT_REVISION=${{ github.sha }} \
            disasters-db disaster-service identity-service mail-service admin-bootstrap api-gateway
          # CHG-102: api-gateway y disaster-service salen de `compose up`
          # y pasan al stack de Swarm, que los actualiza con rolling
          # update en vez de reemplazar el contenedor en frío. Esa es la
          # ventana de 5-15 s de 502/503/504 que CHG-101 sortea desde el
          # cliente; aquí se ataca en el origen. El resto de servicios
          # sigue en compose, y el build de arriba no cambia.
          docker compose up -d --wait disasters-db identity-service mail-service admin-bootstrap
          # CHG-103: `docker stack deploy` no lee el .env del directorio
          # como sí hace `docker compose`, así que sin esto
          # POSTGRES_PASSWORD y ALLOWED_ORIGINS llegan vacíos al
          # contenedor y el servicio arranca en bucle con
          # InvalidPasswordError.
          #
          # No se hace `source`: un .env de Compose no es un script de
          # bash. Compose lo parsea con sus reglas, mientras que bash lo
          # ejecuta, así que un valor con espacios, `$`, `#` o comillas
          # aborta el paso entero. Aquí se leen pares CLAVE=VALOR y se
          # exporta el valor literal, que es lo que hace Compose.
          if [ ! -r "$COMPOSE_DIR/.env" ]; then
            echo "::error::No se puede leer $COMPOSE_DIR/.env; el stack arrancaría sin credenciales."
            exit 1
          fi
          while IFS= read -r linea || [ -n "$linea" ]; do
            case "$linea" in ''|'#'*) continue ;; esac
            clave=${linea%%=*}
            valor=${linea#*=}
            case "$clave" in ''|*[!A-Za-z0-9_]*) continue ;; esac
            case "$valor" in
              '"'*'"') valor=${valor#\"}; valor=${valor%\"} ;;
              "'"*"'") valor=${valor#\'}; valor=${valor%\'} ;;
            esac
            export "$clave=$valor"
          done < "$COMPOSE_DIR/.env"
          # Falla aquí, con un mensaje claro, antes que en el arranque
          # del contenedor con un InvalidPasswordError opaco.
          for requerida in POSTGRES_PASSWORD ALLOWED_ORIGINS; do
            eval "valor=\${$requerida:-}"
            if [ -z "$valor" ]; then
              echo "::error::$requerida quedó vacía tras leer $COMPOSE_DIR/.env; el stack no se despliega."
              exit 1
            fi
          done
          docker stack deploy -c docker-compose.swarm-hotpath.yml borde-hp

      # CHG-111: `docker stack deploy` compara la ESPECIFICACIÓN del
      # servicio, no el contenido de la imagen. Con una etiqueta fija la
      # especificación no cambia entre despliegues y Swarm deja las
      # réplicas como estaban — por eso los despliegues salían en verde
      # sirviendo el código anterior al corte de CHG-102. Apuntar al
      # identificador de la imagen recién construida sí cambia la
      # especificación en cada commit, y `--detach=false` espera a que
      # las réplicas converjan (la salvedad que CHG-102 dejó anotada).
      - name: Forzar el hot path a la imagen recién construida
        run: |
          cd "$COMPOSE_DIR"
          for servicio in disaster-service api-gateway; do
            echo "--- $servicio ---"
            if ! docker service inspect "borde-hp_$servicio" >/dev/null 2>&1; then
              echo "::warning::borde-hp_$servicio no existe en el stack borde-hp; no hay nada que forzar."
              continue
            fi
            declarada=$(docker service inspect "borde-hp_$servicio" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
            # Swarm fija un digest a la etiqueta al desplegar. Ese digest
            # es justamente lo que congela el contenido: mientras siga
            # ahí, reiniciar la réplica reproduce la imagen vieja aunque
            # la etiqueta apunte ya a otra cosa. Se quita para que el
            # servicio vuelva a resolver la etiqueta por su contenido
            # actual, y `--no-resolve-image` evita que se vuelva a fijar.
            referencia=${declarada%@*}
            echo "  declarada por el stack: $declarada"
            if ! id=$(docker image inspect --format '{{.Id}}' "$referencia" 2>/dev/null); then
              echo "::error::El stack declara $referencia, que no existe en este nodo después del build."
              echo "::error::Eso significa que ~/docker-compose.swarm-hotpath.yml no apunta a la imagen que construye 'docker compose build'; mientras siga así, ningún despliegue puede llegar a producción."
              echo "  imágenes que construye Compose en este directorio:"
              docker compose config --images | sed 's/^/    /'
              exit 1
            fi
            echo "  contenido actual de esa etiqueta: $id"

            # Diagnóstico. No aborta nunca, pero es lo único que
            # distingue "Swarm no se actualiza" de "el tráfico no llega
            # a Swarm".
            compose_vivos=$(docker ps --filter "label=com.docker.compose.service=$servicio" --format '{{.Names}} ({{.Status}})' | tr '\n' ' ')
            swarm_vivos=$(docker ps --filter "label=com.docker.swarm.service.name=borde-hp_$servicio" --format '{{.Names}} ({{.Status}})' | tr '\n' ' ')
            echo "  contenedores Compose: ${compose_vivos:-ninguno}"
            echo "  contenedores Swarm:   ${swarm_vivos:-ninguno}"
            if [ -n "$compose_vivos" ]; then
              echo "::warning::$servicio conserva contenedores de Compose además del stack. Si el proxy resuelve a ellos, el código nuevo no llega por mucho que Swarm se actualice."
            fi

            docker service update --detach=false --no-resolve-image \
              --force --image "$referencia" "borde-hp_$servicio"

            for contenedor in $(docker ps -q --filter "label=com.docker.swarm.service.name=borde-hp_$servicio"); do
              corriendo=$(docker inspect --format '{{.Image}}' "$contenedor")
              if [ "$corriendo" = "$id" ]; then
                echo "  la réplica $contenedor corre la imagen recién construida."
              else
                echo "::warning::La réplica $contenedor corre $corriendo, no $id."
              fi
            done
          done

      - name: Aplicar migraciones idempotentes
        run: cd "$DEPLOY_DIR" && flock -w 900 "$DEPLOY_LOCK" make migrate

      - name: Smoke de la plataforma
        run: cd "$DEPLOY_DIR" && flock -w 900 "$DEPLOY_LOCK" make smoke

  # Despliegue al VPS de producción real (cusoldisasterplatform.com). Job
  # independiente del de arriba (que sigue apuntando a la Raspberry Pi de
  # pruebas): corre en su propio runner self-hosted y usa el
  # docker-compose.yml combinado que vive fuera de este repo, en el home del
  # VPS, junto al proxy nginx con TLS. Si la Pi está apagada o su runner no
  # responde, este job se ejecuta igual.
  deploy-vps:
    runs-on: [self-hosted, disasters-backend-prod]
    concurrency:
      group: deploy-backend-vps-production
      cancel-in-progress: false
    env:
      DEPLOY_DIR: /home/cusol01/CUSOL_UIS_DisastersPlatform_Backend
      COMPOSE_DIR: /home/cusol01
    steps:
      - name: Actualizar código en la carpeta de despliegue
        run: |
          cd "$DEPLOY_DIR"
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::El árbol de producción tiene cambios sin commit; despliegue abortado para no destruir trabajo local."
            exit 1
          fi
          git fetch origin ${{ github.sha }}
          git reset --hard ${{ github.sha }}

      - name: Reconstruir y levantar servicios de backend
        run: |
          cd "$COMPOSE_DIR"
          # CHG-111: la revisión viaja dentro de la imagen para que
          # producción pueda demostrar qué código sirve. Va por CLI y no
          # por el docker-compose.yml del VPS porque ese archivo vive
          # fuera de este repositorio.
          docker compose build --build-arg GIT_REVISION=${{ github.sha }} \
            disasters-db disaster-service identity-service mail-service admin-bootstrap api-gateway
          # CHG-102: api-gateway y disaster-service salen de `compose up`
          # y pasan al stack de Swarm, que los actualiza con rolling
          # update en vez de reemplazar el contenedor en frío. Esa es la
          # ventana de 5-15 s de 502/503/504 que CHG-101 sortea desde el
          # cliente; aquí se ataca en el origen. El resto de servicios
          # sigue en compose, y el build de arriba no cambia.
          docker compose up -d --wait disasters-db identity-service mail-service admin-bootstrap
          # CHG-103: `docker stack deploy` no lee el .env del directorio
          # como sí hace `docker compose`, así que sin esto
          # POSTGRES_PASSWORD y ALLOWED_ORIGINS llegan vacíos al
          # contenedor y el servicio arranca en bucle con
          # InvalidPasswordError.
          #
          # No se hace `source`: un .env de Compose no es un script de
          # bash. Compose lo parsea con sus reglas, mientras que bash lo
          # ejecuta, así que un valor con espacios, `$`, `#` o comillas
          # aborta el paso entero. Aquí se leen pares CLAVE=VALOR y se
          # exporta el valor literal, que es lo que hace Compose.
          if [ ! -r "$COMPOSE_DIR/.env" ]; then
            echo "::error::No se puede leer $COMPOSE_DIR/.env; el stack arrancaría sin credenciales."
            exit 1
          fi
          while IFS= read -r linea || [ -n "$linea" ]; do
            case "$linea" in ''|'#'*) continue ;; esac
            clave=${linea%%=*}
            valor=${linea#*=}
            case "$clave" in ''|*[!A-Za-z0-9_]*) continue ;; esac
            case "$valor" in
              '"'*'"') valor=${valor#\"}; valor=${valor%\"} ;;
              "'"*"'") valor=${valor#\'}; valor=${valor%\'} ;;
            esac
            export "$clave=$valor"
          done < "$COMPOSE_DIR/.env"
          # Falla aquí, con un mensaje claro, antes que en el arranque
          # del contenedor con un InvalidPasswordError opaco.
          for requerida in POSTGRES_PASSWORD ALLOWED_ORIGINS; do
            eval "valor=\${$requerida:-}"
            if [ -z "$valor" ]; then
              echo "::error::$requerida quedó vacía tras leer $COMPOSE_DIR/.env; el stack no se despliega."
              exit 1
            fi
          done
          docker stack deploy -c docker-compose.swarm-hotpath.yml borde-hp

      # CHG-111: `docker stack deploy` compara la ESPECIFICACIÓN del
      # servicio, no el contenido de la imagen. Con una etiqueta fija la
      # especificación no cambia entre despliegues y Swarm deja las
      # réplicas como estaban — por eso los despliegues salían en verde
      # sirviendo el código anterior al corte de CHG-102. Apuntar al
      # identificador de la imagen recién construida sí cambia la
      # especificación en cada commit, y `--detach=false` espera a que
      # las réplicas converjan (la salvedad que CHG-102 dejó anotada).
      - name: Forzar el hot path a la imagen recién construida
        run: |
          cd "$COMPOSE_DIR"
          for servicio in disaster-service api-gateway; do
            echo "--- $servicio ---"
            imagen=$(docker compose config --images "$servicio" 2>/dev/null | head -1)
            if [ -z "$imagen" ]; then
              echo "::error::No se pudo determinar la imagen de $servicio en $COMPOSE_DIR."
              exit 1
            fi
            id=$(docker image inspect --format '{{.Id}}' "$imagen")
            echo "  imagen construida: $imagen"
            echo "  identificador:     $id"

            # Diagnóstico. No aborta nunca: es lo único que distingue
            # "Swarm no actualiza" de "el tráfico no llega a Swarm".
            compose_vivos=$(docker ps --filter "label=com.docker.compose.service=$servicio" --format '{{.Names}} ({{.Status}})' | tr '\n' ' ')
            swarm_vivos=$(docker ps --filter "label=com.docker.swarm.service.name=borde-hp_$servicio" --format '{{.Names}} ({{.Status}})' | tr '\n' ' ')
            echo "  contenedores Compose: ${compose_vivos:-ninguno}"
            echo "  contenedores Swarm:   ${swarm_vivos:-ninguno}"
            if [ -n "$compose_vivos" ]; then
              echo "::warning::$servicio tiene contenedores de Compose vivos además del stack; si el proxy resuelve a ellos, el código nuevo no llega aunque Swarm se actualice."
            fi

            if ! docker service inspect "borde-hp_$servicio" >/dev/null 2>&1; then
              echo "::warning::borde-hp_$servicio no existe en el stack borde-hp; no hay nada que forzar."
              continue
            fi
            echo "  imagen declarada por el stack: $(docker service inspect "borde-hp_$servicio" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')"
            docker service update --detach=false --resolve-image=never \
              --force --image "$id" "borde-hp_$servicio"

            for contenedor in $(docker ps -q --filter "label=com.docker.swarm.service.name=borde-hp_$servicio"); do
              corriendo=$(docker inspect --format '{{.Image}}' "$contenedor")
              if [ "$corriendo" = "$id" ]; then
                echo "  réplica $contenedor corre la imagen construida."
              else
                echo "::warning::La réplica $contenedor corre $corriendo, no $id."
              fi
            done
          done

      - name: Aplicar migraciones idempotentes
        run: |
          cd "$COMPOSE_DIR"
          for f in "$DEPLOY_DIR"/infra/postgres/init/*.sql; do
            echo "  -> $f"
            # CHG-105: sin esto, una migración que falla no detenía el
            # bucle ni el job, así que el despliegue se marcaba en verde
            # con el esquema a medio aplicar y nadie se enteraba. El job
            # de la Pi ya abortaba (make migrate usa `|| exit 1`); este
            # no.
            if ! docker compose exec -T disasters-db sh -c 'psql -v ON_ERROR_STOP=1 -q -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < "$f"; then
              echo "::error::Falló la migración $f; el esquema quedó a medio aplicar."
              exit 1
            fi
          done

      - name: Verificación básica por el dominio de producción
        run: |
          curl --fail --silent --show-error https://cusoldisasterplatform.com/api/v1/disasters >/dev/null

      # CHG-111: la puerta. Hasta ahora un despliegue no podía
      # distinguirse de un despliegue que no ocurrió: el `curl` de
      # arriba responde 200 igual sirviendo código de hace tres días.
      # Esto compara la revisión que sirve producción con el commit que
      # se acaba de desplegar y aborta si no coinciden. Un rojo que dice
      # la verdad vale más que un verde que no la dice.
      - name: Puerta de revisión — producción tiene que servir este commit
        run: |
          esperado='${{ github.sha }}'
          url=https://cusoldisasterplatform.com/api/v1/platform/version
          servida=''
          detras=''
          # Swarm reemplaza las réplicas de forma escalonada y el proxy
          # puede tardar en soltar la conexión anterior; se conceden
          # ~60 s antes de dar el despliegue por mentiroso.
          for intento in 1 2 3 4 5 6; do
            cuerpo=$(curl --silent --max-time 10 "$url" || true)
            case "$cuerpo" in
              *'"revision"'*)
                servida=$(printf '%s' "$cuerpo" | sed -e 's/"upstream".*//' -e 's/.*"revision":"//' -e 's/".*//')
                ;;
              *) servida='' ;;
            esac
            case "$cuerpo" in
              *'"upstream":null'*) detras='' ;;
              *'"upstream"'*) detras=$(printf '%s' "$cuerpo" | sed -e 's/.*"upstream"//' -e 's/.*"revision":"//' -e 's/".*//') ;;
              *) detras='' ;;
            esac
            if [ "$servida" = "$esperado" ]; then break; fi
            echo "  intento $intento: producción sirve '${servida:-nada}', se espera '$esperado'."
            sleep 10
          done

          if [ "$servida" != "$esperado" ]; then
            echo "::error::Producción NO está sirviendo el commit desplegado."
            echo "::error::Esperado: $esperado — servido: ${servida:-la ruta no existe en el proceso que atiende}"
            echo "::error::Las imágenes y las migraciones sí se aplicaron; lo que no llega es el código al proceso que atiende el dominio. Revisar el diagnóstico del paso 'Forzar el hot path': si hay contenedores de Compose vivos para estos servicios, el proxy les está entregando el tráfico y la corrección vive en ~/docker-compose.yml y en la configuración de nginx del servidor."
            exit 1
          fi

          echo "Producción sirve $servida."
          if [ -z "$detras" ]; then
            echo "::warning::El servicio de desastres no respondió a la consulta de revisión; no se pudo comprobar qué código corre detrás del gateway."
          elif [ "$detras" != "$esperado" ]; then
            echo "::error::El gateway está al día pero el servicio de desastres sirve $detras en vez de $esperado."
            exit 1
          else
            echo "El servicio de desastres también sirve $detras."
          fi
